<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>David Beckham Quiz</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .card {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 400px;
            width: 90%;
            position: relative;
        }

        h1 {
            font-size: 1.3rem;
            margin-bottom: 30px;
            color: #f1c40f;
        }

        .btn-group {
            display: flex;
            gap: 20px;
            justify-content: center;
            min-height: 50px;
        }

        button {
            padding: 12px 24px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.1s ease;
        }

        #btn-correct {
            background-color: #2ecc71;
            color: white;
        }

        #btn-wrong {
            background-color: #e74c3c;
            color: white;
            position: absolute;
        }

        /* Khu vực hiển thị video chúc mừng */
        #celebration {
            display: none;
            margin-top: 15px;
            text-align: center;
        }

        #celebration h2 {
            color: #2ecc71;
            font-size: 1.3rem;
            margin-bottom: 15px;
        }

        #congratulation-video {
            width: 100%;
            max-width: 320px;
            border-radius: 8px;
            box-shadow: 0 0 15px #2ecc71;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>David Beckham ghi bao nhiêu bàn?</h1>
        
        <div class="btn-group">
            <button id="btn-correct" onclick="showSuccess()">700 bàn</button>
            <button id="btn-wrong" onmouseover="moveButton()" onclick="moveButton()">1000 bàn</button>
        </div>

        <!-- Nội dung chúc mừng và video của bạn -->
        <div id="celebration">
            <h2>Chính xác! 🎉 Chúc mừng bạn!</h2>
            <video id="congratulation-video" controls autoplay loop playsinline>
                <source src="https://www.image2url.com/r2/default/videos/1786376229847-5a7990e0-ca5c-4441-aa55-fcdc23b1a001.mp4" type="video/mp4">
                Trình duyệt của bạn không hỗ trợ video.
            </video>
        </div>
    </div>

    <script>
        // Thiết lập vị trí ban đầu cho nút 1000 bàn
        const btnWrong = document.getElementById('btn-wrong');
        btnWrong.style.left = 'calc(50% + 10px)';

        function moveButton() {
            if (document.getElementById('celebration').style.display !== 'block') {
                const x = Math.random() * (window.innerWidth - 120);
                const y = Math.random() * (window.innerHeight - 50);
                
                btnWrong.style.position = 'fixed';
                btnWrong.style.left = x + 'px';
                btnWrong.style.top = y + 'px';
            }
        }

        function showSuccess() {
            // Ẩn tiêu đề và các nút bấm
            document.querySelector('h1').style.display = 'none';
            document.querySelector('.btn-group').style.display = 'none';

            // Hiển thị khu vực chúc mừng và video
            const celebration = document.getElementById('celebration');
            celebration.style.display = 'block';

            // Tự động phát video
            const video = document.getElementById('congratulation-video');
            video.play();
        }
    </script>

</body>
</html>
